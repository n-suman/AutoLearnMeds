[project]
name = "autolearnmeds"
version = "0.1.0"
readme = "README.md"
description = "Autoresearch-driven custom VLM for pharmaceutical product label information extraction"
requires-python = ">=3.11"
authors = [{ name = "Suman" }]
license = { text = "MIT" }

# Core deps installable on the Mac (no heavy ML)
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
# Local dev: tests, lint
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

# Heavy ML deps — installed on Colab only via `uv sync --extra ml`
ml = [
    "torch>=2.3",
    "torchvision>=0.18",
    "transformers>=4.42",
    "accelerate>=0.31",
    "datasets>=2.20",
    "pillow>=10.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "wandb>=0.17",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "tokenizers>=0.19",
    "python-Levenshtein>=0.25",
]

# Colab-specific
colab = [
    "colab-ssh>=0.3.27",
    "google-cloud-storage>=2.17",
    "gdown>=5.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
